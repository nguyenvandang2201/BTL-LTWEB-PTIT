name: CI

# Chạy kiểm thử tự động cho mọi push và pull request vào nhánh chính.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Huỷ các lần chạy cũ còn dang dở khi có commit mới trên cùng một nhánh,
# tránh lãng phí runner và rút ngắn thời gian phản hồi.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Kiểm tra backend: lint mã nguồn, validate Prisma schema, chạy migration và
  # seed trên một PostgreSQL thật, sau đó gọi thử endpoint health.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint, migrate, seed)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: online_course_test
        ports:
          - 5432:5432
        # Chờ PostgreSQL sẵn sàng trước khi các bước phía sau chạy.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/online_course_test?schema=public
      JWT_SECRET: ci-secret-chi-dung-cho-pipeline-khong-dung-that-32
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cài đặt dependencies
        working-directory: backend
        run: npm ci

      - name: Kiểm tra lint
        working-directory: backend
        run: npm run lint

      - name: Validate Prisma schema
        working-directory: backend
        run: npx prisma validate

      - name: Áp dụng migration
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Chạy seed dữ liệu mẫu
        working-directory: backend
        run: npm run seed

      - name: Kiểm tra server khởi động và endpoint health
        working-directory: backend
        run: |
          npm start &
          SERVER_PID=$!
          # Thử tối đa 20 lần, mỗi lần cách nhau 1 giây (tổng 20s).
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5000/api/health > /dev/null; then
              echo "Server đã sẵn sàng."
              curl -s http://localhost:5000/api/health
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server không phản hồi sau 20 giây."
          kill $SERVER_PID
          exit 1

  # ---------------------------------------------------------------------------
  # Kiểm tra frontend: lint mã nguồn và build bản production.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài đặt dependencies
        working-directory: frontend
        run: npm ci

      - name: Kiểm tra lint
        working-directory: frontend
        run: npm run lint

      - name: Build production
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5000/api
        run: npm run build
